{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .}}42 projects{{end}} · alborghi</title>
<style>
  :root {
    --bg: #0e0f11; --panel: #16181b; --line: #26292e; --text: #e8e6e3; --muted: #8b8f96;
    --accent: #00babc; --ok: #4ec27d; --warn: #e0b341; --bad: #e0605a;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: inherit; }
  main { max-width: 960px; margin: 0 auto; padding: 48px 20px 80px; }
  header.site { display: flex; align-items: baseline; gap: 12px; margin-bottom: 40px; }
  header.site a { text-decoration: none; font-family: var(--mono); font-weight: 700; font-size: 18px; }
  header.site a span { color: var(--accent); }
  header.site small { color: var(--muted); }
  h1 { font-size: 32px; line-height: 1.15; margin: 0 0 8px; letter-spacing: -0.01em; }
  .muted { color: var(--muted); }
  .badge { display: inline-block; font: 600 12px/1 var(--mono); padding: 5px 8px; border-radius: 4px; border: 1px solid currentColor; white-space: nowrap; }
  .badge.validated { color: var(--ok); }
  .badge.progress { color: var(--warn); }
  .badge.failed { color: var(--bad); }
  .badge.live { color: var(--accent); }
  .mark { font: 700 15px var(--mono); }
  table.projects { width: 100%; border-collapse: collapse; }
  table.projects th { text-align: left; font: 600 12px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 0 12px 10px; border-bottom: 1px solid var(--line); }
  table.projects td { padding: 14px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.projects tr:hover td { background: var(--panel); }
  table.projects td.name a { text-decoration: none; font-weight: 600; }
  table.projects td.name a:hover { color: var(--accent); }
  table.projects td.num { text-align: right; }
  .stack { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0; padding: 0; list-style: none; }
  .stack li { font: 12px var(--mono); background: var(--panel); border: 1px solid var(--line); padding: 4px 8px; border-radius: 4px; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin: 24px 0; }
  .facts div { background: var(--panel); padding: 14px 16px; }
  .facts dt { font: 600 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .facts dd { margin: 4px 0 0; }
  .notice { border: 1px solid var(--warn); color: var(--warn); border-radius: 6px; padding: 12px 16px; margin: 0 0 24px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 28px; }
  .btn { display: inline-block; text-decoration: none; font-weight: 600; padding: 10px 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #041314; }
  .btn:hover { filter: brightness(1.12); }
  img.shot { width: 100%; border-radius: 6px; border: 1px solid var(--line); margin-top: 24px; }
  @media (max-width: 640px) { table.projects .hide-sm { display: none; } h1 { font-size: 26px; } }
</style>
</head>
<body>
<main>
  <header class="site"><a href="/"><span>42</span>/alborghi</a><small>projects from 42 Firenze</small></header>
  {{template "content" .}}
</main>
</body>
</html>{{end}}

{{define "status"}}{{$s := .StatusLabel}}<span class="badge {{if eq $s "Validated"}}validated{{else if eq $s "In progress"}}progress{{else}}failed{{end}}">{{$s}}</span>{{end}}
